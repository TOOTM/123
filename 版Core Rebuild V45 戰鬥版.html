<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天堂M Core Rebuild V45｜戰鬥版本</title>
<style>
:root{--bg:#05070a;--panel:#101827;--panel2:#172235;--line:#334155;--text:#e5eef9;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--purple:#c084fc;--orange:#fb923c;--cyan:#06b6d4;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070a;color:#e5eef9;font-family:'微軟正黑體','Arial',sans-serif;font-size:14px;overflow-x:hidden}
.app{display:flex;flex-direction:column;height:100vh;background:#05070a}
.top{background:linear-gradient(135deg,#101827,#0f1419);border-bottom:1px solid #334155;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.top .title{font-size:20px;font-weight:bold;color:#facc15}
.top .stats{display:flex;gap:20px;font-size:13px}
.top .stat{display:flex;align-items:center;gap:8px}
.top .stat span{color:#94a3b8}
.top .stat b{color:#facc15}

/* 戰鬥畫面 */
.battle-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:16px}
.battle-arena{width:90%;max-width:800px;height:500px;background:linear-gradient(135deg,#1a2a4a,#0f1825);border:2px solid #334155;border-radius:8px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;position:relative;overflow:hidden}
.battle-side{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.character-display{text-align:center}
.character-portrait{font-size:120px;height:120px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border-radius:8px;margin-bottom:12px;animation:float 3s ease-in-out infinite}
.monster-portrait{font-size:120px;height:120px;display:flex;align-items:center;justify-content:center;background:rgba(255,0,0,0.1);border-radius:8px;margin-bottom:12px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
.character-name{font-weight:bold;font-size:16px;margin-bottom:8px;color:#facc15}
.character-stats{font-size:12px;color:#94a3b8;line-height:1.6}

.hp-bar{width:200px;height:20px;background:#1a1a2e;border:1px solid #334155;border-radius:4px;overflow:hidden;margin:10px 0}
.hp-fill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);width:100%;transition:width 0.3s ease}
.hp-text{position:absolute;font-size:11px;color:#fff;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:bold}

.mp-bar{width:200px;height:12px;background:#1a1a2e;border:1px solid #334155;border-radius:2px;overflow:hidden;margin:5px 0}
.mp-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#3b82f6);width:100%;transition:width 0.3s ease}

.battle-log{width:90%;max-width:800px;height:200px;background:#101827;border:1px solid #334155;border-radius:8px;padding:12px;overflow-y:auto;margin-top:20px;font-size:13px}
.log-entry{margin:4px 0;padding:4px;border-radius:2px;animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.log-entry.damage{color:#ef4444;border-left:3px solid #ef4444;padding-left:8px}
.log-entry.heal{color:#22c55e;border-left:3px solid #22c55e;padding-left:8px}
.log-entry.system{color:#94a3b8;border-left:3px solid #94a3b8;padding-left:8px}

.damage-float{position:absolute;font-weight:bold;pointer-events:none;animation:damageFloat 1.5s ease-out forwards}
@keyframes damageFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.damage-float.player-dmg{color:#22c55e;left:25%;top:40%}
.damage-float.enemy-dmg{color:#ef4444;right:25%;top:40%}

.battle-buttons{width:90%;max-width:800px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.btn-action{padding:12px;border:1px solid #334155;background:#101827;color:#e5eef9;border-radius:4px;cursor:pointer;transition:all 0.2s;font-size:12px;font-weight:bold}
.btn-action:hover{background:#1a2d45;border-color:#60a5fa;color:#60a5fa}
.btn-action:disabled{opacity:0.5;cursor:not-allowed}
.btn-action.primary{background:#60a5fa;border-color:#60a5fa;color:#000}
.btn-action.primary:hover{background:#3b82f6}
.btn-action.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.btn-action.danger:hover{background:#dc2626}

.hidden{display:none!important}

/* 通用樣式 */
.card{background:#101827;border:1px solid #334155;border-radius:6px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.item{background:#172235;border:1px solid #334155;border-radius:6px;padding:10px;cursor:pointer;transition:all 0.2s}
.item:hover{background:#1a2d45;border-color:#60a5fa}
.gold{color:#facc15}
.green{color:#22c55e}
.red{color:#ef4444}
.blue{color:#60a5fa}
.purple{color:#c084fc}
.cyan{color:#06b6d4}
.muted{color:#94a3b8}
button{font-family:inherit;cursor:pointer;transition:all 0.2s}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="top">
    <div><span class="title" style="font-size:20px">天堂M Core Rebuild｜戰鬥版本</span> <span id="subtitle" class="muted"></span></div>
    <div class="stats">
      <div class="stat"><span>Lv.</span><b id="lv">1</b></div>
      <div class="stat"><span>HP:</span><b id="hp" class="green">100/100</b></div>
      <div class="stat"><span>金幣:</span><b id="adena" class="gold">0</b></div>
      <div class="stat"><span>鑽石:</span><b id="diamond" class="cyan">0</b></div>
    </div>
  </div>
  <div id="content" style="flex:1;overflow-y:auto;padding:16px;">
    <div id="mainContent"></div>
  </div>
</div>

<!-- 戰鬥畫面 -->
<div id="battleScreen" class="battle-screen hidden">
  <div class="battle-arena">
    <div class="battle-side">
      <div class="character-display">
        <div class="character-portrait" id="playerPortrait">⚔️</div>
        <div class="character-name" id="playerName">勇者</div>
        <div class="character-stats" id="playerStats">Lv.1 | HP:100</div>
        <div class="hp-bar" style="position:relative;">
          <div class="hp-fill" id="playerHpBar" style="width:100%;"></div>
          <div class="hp-text" id="playerHpText">100/100</div>
        </div>
        <div class="mp-bar">
          <div class="mp-fill" id="playerMpBar" style="width:100%;"></div>
        </div>
      </div>
    </div>
    <div class="battle-side">
      <div class="character-display">
        <div class="monster-portrait" id="monsterPortrait">👹</div>
        <div class="character-name red" id="monsterName">哥布林</div>
        <div class="character-stats" id="monsterStats">Lv.1 | HP:50</div>
        <div class="hp-bar" style="position:relative;">
          <div class="hp-fill" id="monsterHpBar" style="width:100%;background:linear-gradient(90deg,#ef4444,#dc2626)"></div>
          <div class="hp-text" id="monsterHpText">50/50</div>
        </div>
      </div>
    </div>
  </div>

  <div class="battle-log" id="battleLog"></div>

  <div class="battle-buttons">
    <button class="btn-action primary" id="btnAttack">⚔️ 攻擊</button>
    <button class="btn-action blue" id="btnSkill">✨ 技能</button>
    <button class="btn-action green" id="btnPotion">🧪 使用藥水</button>
    <button class="btn-action danger" id="btnFlee">🏃 逃跑</button>
  </div>
</div>

<script>
'use strict';
const R={N:['一般',1],R:['高級',2],SR:['稀有',3],SSR:['英雄',4],L:['傳說',5],M:['神話',6]};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DB={classes:{},item:{},cards:{},maps:[],dungeons:[],bosses:[],codex:[],skills:{}};

function addClass(id,name,stats,weapons,desc){DB.classes[id]={id,name,stats,weapons,desc};}
[['prince','王族',{str:13,dex:10,con:12,int:10,wis:11},['sword','dagger'],'血盟與輔助'],['knight','騎士',{str:16,dex:12,con:15,int:8,wis:9},['sword','twohand','spear'],'高防禦近戰']].forEach(x=>addClass(...x));

function addItem(id,o){DB.item[id]=Object.assign({id,type:'material',rank:'N',price:100},o);}
addItem('potion_red',{name:'紅水',type:'potion',rank:'N',price:50});
addItem('short_sword',{name:'短劍',type:'weapon',weapon:'dagger',dmg:5,rank:'N',safe:6,price:100});

DB.maps=[['talking','說話之島',1,18,['哥布林','妖魔','狼人'],['short_sword','potion_red']]];
DB.bosses=[['b0','巨大飛龍',30,1500,'world']];

const Store={key:'lm_core_rebuild_battle',save:s=>localStorage.setItem('lm_core_rebuild_battle',JSON.stringify(s)),load:()=>{try{return JSON.parse(localStorage.getItem('lm_core_rebuild_battle')||'null')}catch{return null}}};

const Battle={active:false,playerHp:100,playerMaxHp:100,monsterHp:50,monsterMaxHp:50,monsterName:'哥布林',monsterLevel:1,isPlayerTurn:true,log:[]};

const Game={s:null,timer:null,tab:'hunt',pick:null,$:id=>document.getElementById(id),
  init(){
    const save=Store.load();
    if(save){this.s=save;}else{this.newGame();}
    this.render();
  },
  newGame(){
    this.s={cls:'knight',lv:1,exp:0,adena:1000,diamond:10,hp:100,mp:50,map:'talking',mon:null,stats:{str:16,dex:12,con:15,int:8,wis:9},inv:{},equip:{},skills:{}};
  },
  render(){
    this.$(document.body.querySelector('#lv')).textContent=this.s.lv;
    this.$(document.body.querySelector('#adena')).textContent=this.s.adena;
    this.$(document.body.querySelector('#diamond')).textContent=this.s.diamond;
    this.renderHunt();
  },
  renderHunt(){
    let html=`<h3 style="color:#facc15;margin:16px 0">狩獵地圖</h3><div class="grid">`;
    DB.maps.forEach(m=>{
      const mons=m[4].map((name,i)=>`<span class="item" data-act="battle" data-arg="${m[0]}|${i}" style="cursor:pointer;padding:8px;background:#1a2d45;border:1px solid #334155;border-radius:4px;display:inline-block;margin:4px">${name}</span>`).join('');
      html+=`<div class="card"><b>${m[1]}</b><br><span class="muted">Lv.${m[2]}-${m[3]}</span><br><div style="margin-top:8px">${mons}</div></div>`;
    });
    html+=`</div>`;
    this.$('mainContent').innerHTML=html;
  },
  startBattle(mapId,monIdx){
    const map=DB.maps.find(m=>m[0]===mapId);
    if(!map){alert('地圖不存在');return;}
    const monName=map[4][monIdx];
    const monLevel=Math.floor(Math.random()*(map[3]-map[2])+map[2]);
    Battle.active=true;
    Battle.playerHp=100;
    Battle.playerMaxHp=100;
    Battle.monsterHp=Math.floor(50+monLevel*8);
    Battle.monsterMaxHp=Battle.monsterHp;
    Battle.monsterName=monName;
    Battle.monsterLevel=monLevel;
    Battle.isPlayerTurn=true;
    Battle.log=[];
    this.updateBattleUI();
    this.$('battleScreen').classList.remove('hidden');
  },
  updateBattleUI(){
    this.$('playerName').textContent=this.cls().name;
    this.$('playerStats').textContent=`Lv.${this.s.lv} | HP:${Battle.playerHp}`;
    this.$('playerHpBar').style.width=(Battle.playerHp/Battle.playerMaxHp*100)+'%';
    this.$('playerHpText').textContent=`${Battle.playerHp}/${Battle.playerMaxHp}`;
    
    this.$('monsterName').textContent=Battle.monsterName;
    this.$('monsterStats').textContent=`Lv.${Battle.monsterLevel} | HP:${Battle.monsterHp}`;
    this.$('monsterHpBar').style.width=(Battle.monsterHp/Battle.monsterMaxHp*100)+'%';
    this.$('monsterHpText').textContent=`${Battle.monsterHp}/${Battle.monsterMaxHp}`;
    
    this.updateBattleLog();
  },
  updateBattleLog(){
    const log=this.$('battleLog');
    log.innerHTML=Battle.log.slice(-15).map(entry=>`<div class="log-entry ${entry.type}">${E(entry.text)}</div>`).join('');
    log.scrollTop=log.scrollHeight;
  },
  addBattleLog(text,type='system'){
    Battle.log.push({text,type});
    this.updateBattleLog();
  },
  playerAttack(){
    const dmg=Math.floor(Math.random()*10+5+this.s.stats.str);
    Battle.monsterHp=Math.max(0,Battle.monsterHp-dmg);
    this.addBattleLog(`⚔️ ${this.cls().name}造成 ${dmg} 傷害!`,'damage');
    this.createDamageFloat('player',dmg);
    
    if(Battle.monsterHp<=0){
      this.battleWin();
      return;
    }
    Battle.isPlayerTurn=false;
    setTimeout(()=>this.monsterAttack(),800);
  },
  monsterAttack(){
    const dmg=Math.floor(Math.random()*8+3+Battle.monsterLevel);
    Battle.playerHp=Math.max(0,Battle.playerHp-dmg);
    this.addBattleLog(`😈 ${Battle.monsterName}造成 ${dmg} 傷害!`,'damage');
    this.createDamageFloat('enemy',dmg);
    
    if(Battle.playerHp<=0){
      this.battleLose();
      return;
    }
    Battle.isPlayerTurn=true;
    this.updateBattleUI();
  },
  createDamageFloat(type,dmg){
    const arena=this.$('battleScreen').querySelector('.battle-arena');
    const float=document.createElement('div');
    float.className=`damage-float ${type==='player'?'player-dmg':'enemy-dmg'}`;
    float.textContent='-'+dmg;
    arena.appendChild(float);
    setTimeout(()=>float.remove(),1500);
  },
  usePotion(){
    Battle.playerHp=Math.min(Battle.playerMaxHp,Battle.playerHp+50);
    this.addBattleLog('🧪 使用了紅水，HP +50','heal');
    Battle.isPlayerTurn=false;
    setTimeout(()=>this.monsterAttack(),800);
  },
  flee(){
    if(Math.random()<0.4){
      this.addBattleLog('✓ 成功逃跑!','system');
      setTimeout(()=>this.endBattle(),800);
    }else{
      this.addBattleLog('✗ 逃跑失敗!','system');
      Battle.isPlayerTurn=false;
      setTimeout(()=>this.monsterAttack(),800);
    }
  },
  battleWin(){
    const reward=Math.floor(100+Battle.monsterLevel*20);
    this.s.adena+=reward;
    this.addBattleLog(`🎉 勝利! 獲得 ${reward} 金幣!`,'heal');
    this.$('btnAttack').disabled=true;
    this.$('btnSkill').disabled=true;
    this.$('btnPotion').disabled=true;
    this.$('btnFlee').disabled=true;
    setTimeout(()=>{this.endBattle();this.render();},2000);
  },
  battleLose(){
    this.addBattleLog('💀 戰敗了...','damage');
    this.$('btnAttack').disabled=true;
    this.$('btnSkill').disabled=true;
    this.$('btnPotion').disabled=true;
    this.$('btnFlee').disabled=true;
    setTimeout(()=>{this.endBattle();this.render();},2000);
  },
  endBattle(){
    Battle.active=false;
    this.$('battleScreen').classList.add('hidden');
    this.$('btnAttack').disabled=false;
    this.$('btnSkill').disabled=false;
    this.$('btnPotion').disabled=false;
    this.$('btnFlee').disabled=false;
  },
  cls(){return DB.classes[this.s.cls]||DB.classes.knight;},
  def(id){return DB.item[id];},
  save(quick){Store.save(this.s);if(quick)alert('已儲存!');}
};

window.DB=DB;
window.G=Game;
window.Battle=Battle;

// 事件綁定
document.addEventListener('click',(e)=>{
  const act=e.target.getAttribute('data-act');
  const arg=e.target.getAttribute('data-arg');
  if(act==='battle'){
    const [mapId,monIdx]=arg.split('|');
    Game.startBattle(mapId,parseInt(monIdx));
  }
});

// 戰鬥按鈕
document.getElementById('btnAttack').addEventListener('click',()=>{
  if(!Battle.active||!Battle.isPlayerTurn)return;
  Game.playerAttack();
  Game.updateBattleUI();
});

document.getElementById('btnSkill').addEventListener('click',()=>{
  if(!Battle.active||!Battle.isPlayerTurn)return;
  Game.addBattleLog('⚡ 技能尚未開放!','system');
});

document.getElementById('btnPotion').addEventListener('click',()=>{
  if(!Battle.active||!Battle.isPlayerTurn)return;
  Game.usePotion();
  Game.updateBattleUI();
});

document.getElementById('btnFlee').addEventListener('click',()=>{
  if(!Battle.active||!Battle.isPlayerTurn)return;
  Game.flee();
  Game.updateBattleUI();
});

Game.init();
</script>
</body>
</html>
