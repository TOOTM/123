
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天堂M Core Rebuild V43｜分解材料優化版</title>
<style>
:root{--bg:#05070a;--panel:#101827;--panel2:#172235;--line:#334155;--text:#e5eef9;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--purple:#c084fc;--orange:#fb923c;--cyan:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-card{background:var(--panel);border-radius:8px;padding:20px;max-width:500px;width:90%}
.title{font-size:1.5em;font-weight:600;margin-bottom:10px;color:var(--gold)}
.muted{color:var(--muted);font-size:0.9em}
.button,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 16px;cursor:pointer;transition:.2s}
.button:hover,button:hover{background:var(--line)}
button.gold{background:var(--gold);color:#000}
button.red{background:var(--red);color:#fff}
button.green{background:var(--green);color:#000}
button.blue{background:var(--blue);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ===== V44 Battle Animation ===== */

#battleField{
    position:relative;
    width:100%;
    height:400px;
    background:linear-gradient(to bottom,#2d5a27,#1a3218);
    border:2px solid #666;
    border-radius:12px;
    overflow:hidden;
    margin:20px 0;
    box-shadow:inset 0 0 20px rgba(0,0,0,.5);
}

#battleField::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.1),transparent);
    pointer-events:none;
}

.battleUI{
    position:absolute;
    bottom:20px;
    left:20px;
    right:20px;
    background:rgba(0,0,0,.6);
    padding:15px;
    border-radius:8px;
    z-index:10;
    backdrop-filter:blur(5px);
}

.battleStatus{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:15px;
}

.statusBox{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.statusBox b{
    font-size:1.1em;
    color:var(--gold);
}

.hpBar{
    position:relative;
    height:24px;
    background:#1a1a1a;
    border-radius:4px;
    overflow:hidden;
    border:1px solid #444;
}

.hpBar span{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    transition:width .3s;
    position:relative;
}

.hpBar span::after{
    content:attr(data-hp);
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    color:#fff;
    font-weight:bold;
    font-size:0.9em;
    text-shadow:1px 1px 2px #000;
}

.playerSprite{
    position:absolute;
    left:60px;
    bottom:100px;
    font-size:120px;
    transition:transform .2s;
    z-index:5;
    filter:drop-shadow(0 0 10px rgba(34,197,94,.3));
}

.monsterSprite{
    position:absolute;
    right:60px;
    bottom:100px;
    font-size:120px;
    transition:transform .2s;
    z-index:5;
    filter:drop-shadow(0 0 10px rgba(239,68,68,.3));
}

.damageFloat{
    position:absolute;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
    pointer-events:none;
    z-index:99;
    animation:dmgFloat 1s forwards;
}

.damageFloat.normal{
    color:#ff6b6b;
}

.damageFloat.crit{
    color:#ffd700;
    font-size:48px;
    animation:dmgFloat 1s forwards,critPulse .3s;
}

.damageFloat.heal{
    color:#22c55e;
    font-size:40px;
}

.damageFloat.miss{
    color:#94a3b8;
    font-size:28px;
}

.hitShake{
    animation:hitShake .25s;
}

.battleActions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.battleActions button{
    padding:12px;
    font-size:1em;
    font-weight:600;
}

.battleActions button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.battleLog{
    margin-top:15px;
    padding:10px;
    background:rgba(0,0,0,.3);
    border-radius:6px;
    font-size:0.9em;
    max-height:80px;
    overflow-y:auto;
    color:var(--muted);
}

.battleLog .log-entry{
    padding:4px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.battleLog .log-entry:last-child{
    border-bottom:none;
}

.log-entry.damage{
    color:#ff6b6b;
}

.log-entry.heal{
    color:#22c55e;
}

.log-entry.crit{
    color:#ffd700;
}

.log-entry.miss{
    color:#94a3b8;
}

.log-entry.skill{
    color:#60a5fa;
}

.log-entry.info{
    color:var(--muted);
}

@keyframes hitShake{
    0%{transform:translateX(0)}
    25%{transform:translateX(15px)}
    50%{transform:translateX(-15px)}
    75%{transform:translateX(10px)}
    100%{transform:translateX(0)}
}

@keyframes dmgFloat{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-80px);
    }
}

@keyframes critPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.2)}
}

@keyframes monsterAttack{
    0%{transform:translateX(0)}
    50%{transform:translateX(-30px)}
    100%{transform:translateX(0)}
}

@keyframes playerAttack{
    0%{transform:translateX(0)}
    50%{transform:translateX(30px)}
    100%{transform:translateX(0)}
}

.battleReward{
    background:var(--panel2);
    border-radius:8px;
    padding:20px;
    margin-top:20px;
    text-align:center;
}

.battleReward .big{
    font-size:1.5em;
    font-weight:bold;
    color:var(--gold);
    margin:10px 0;
}

.battleReward button{
    margin-top:10px;
    padding:10px 20px;
}

</style>
</head><body>
<div id="battleModal" class="modal">
    <div style="width:95%;max-width:1000px;background:var(--panel);border-radius:12px;padding:20px">
        <h2 class="title" style="text-align:center">⚔️ 戰鬥 ⚔️</h2>
        <div id="battleField">
            <div id="playerSprite" class="playerSprite">⚔️</div>
            <div id="monsterSprite" class="monsterSprite">👹</div>
            <div class="battleUI">
                <div class="battleStatus">
                    <div class="statusBox">
                        <b id="playerName">玩家</b>
                        <div class="hpBar"><span id="playerHPBar" data-hp=""></span></div>
                    </div>
                    <div class="statusBox">
                        <b id="monsterName" style="color:#ef4444">怪物</b>
                        <div class="hpBar"><span id="monsterHPBar" data-hp=""></span></div>
                    </div>
                </div>
                <div class="battleLog" id="battleLog"></div>
                <div class="battleActions" id="battleActions">
                    <button id="attackBtn" class="gold">普通攻擊</button>
                    <button id="skillBtn" class="blue">技能攻擊</button>
                    <button id="potionBtn" class="green">使用藥水</button>
                    <button id="fleeBtn" class="red">逃離戰鬥</button>
                </div>
            </div>
        </div>
        <div id="battleReward" class="battleReward hide">
            <h3>🎉 勝利！</h3>
            <div class="big" id="rewardText"></div>
            <button class="gold" onclick="Game.closeBattle()">繼續</button>
        </div>
    </div>
</div>

<script>
'use strict';
const R={N:['一般',1],R:['高級',2],SR:['稀有',3],SSR:['英雄',4],L:['傳說',5],M:['神話',6]};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DB={classes:{},item:{},cards:{},maps:[],dungeons:[],bosses:[],codex:[],skills:{}};

/* ===== V44 BATTLE SYSTEM ===== */
(function(){
    const Battle={
        active:false,
        player:null,
        monster:null,
        playerHp:0,
        monsterHp:0,
        playerMaxHp:0,
        monsterMaxHp:0,
        log:[],
        turn:0,
        canAct:true,

        init(player,monster){
            this.active=true;
            this.player=player;
            this.monster=monster;
            this.playerMaxHp=player.hp||100;
            this.monsterMaxHp=monster.hp||50;
            this.playerHp=this.playerMaxHp;
            this.monsterHp=this.monsterMaxHp;
            this.log=[];
            this.turn=0;
            this.canAct=true;
            this.render();
            document.getElementById('battleModal').classList.add('show');
        },

        render(){
            const playerPercent=(this.playerHp/this.playerMaxHp)*100;
            const monsterPercent=(this.monsterHp/this.monsterMaxHp)*100;
            const playerHPBar=document.getElementById('playerHPBar');
            const monsterHPBar=document.getElementById('monsterHPBar');
            
            if(playerHPBar){
                playerHPBar.style.width=playerPercent+'%';
                playerHPBar.setAttribute('data-hp',`${Math.max(0,Math.floor(this.playerHp))}/${Math.floor(this.playerMaxHp)}`);
            }
            if(monsterHPBar){
                monsterHPBar.style.width=monsterPercent+'%';
                monsterHPBar.setAttribute('data-hp',`${Math.max(0,Math.floor(this.monsterHp))}/${Math.floor(this.monsterMaxHp)}`);
            }

            document.getElementById('playerName').textContent=this.player.name||'玩家';
            document.getElementById('monsterName').textContent=this.monster.name||'怪物';

            const battleLog=document.getElementById('battleLog');
            if(battleLog){
                battleLog.innerHTML=this.log.slice(-5).map(entry=>`<div class="log-entry ${entry.type}">${entry.text}</div>`).join('');
                battleLog.scrollTop=battleLog.scrollHeight;
            }

            const rewardDiv=document.getElementById('battleReward');
            if(this.playerHp<=0){
                this.canAct=false;
                document.getElementById('battleActions').style.display='none';
                this.addLog('你被擊敗了！','info');
                rewardDiv.innerHTML=`<h3>💔 敗北</h3><button class="red" onclick="Game.closeBattle()">返回</button>`;
                rewardDiv.classList.remove('hide');
            }else if(this.monsterHp<=0){
                this.canAct=false;
                document.getElementById('battleActions').style.display='none';
                this.addLog('怪物已被擊敗！','info');
                const exp=Math.floor(this.monster.hp/5);
                const adena=Math.floor(this.monster.hp/2);
                rewardDiv.innerHTML=`<h3>🎉 勝利！</h3><div class="big">經驗值 +${exp}<br>金幣 +${adena}</div><button class="gold" onclick="Game.closeBattle()">繼續</button>`;
                rewardDiv.classList.remove('hide');
            }
        },

        addLog(text,type='info'){
            this.log.push({text,type});
        },

        playerAttack(){
            if(!this.canAct)return;
            this.canAct=false;
            const playerSprite=document.getElementById('playerSprite');
            playerSprite.style.animation='none';
            setTimeout(()=>playerSprite.style.animation='playerAttack .4s',10);

            const isCrit=Math.random()<0.15;
            const baseDamage=this.player.dmg||10;
            const variance=Math.floor(Math.random()*baseDamage*0.3);
            let damage=baseDamage+variance;
            if(isCrit) damage=Math.floor(damage*1.5);

            this.monsterHp-=damage;
            this.floatDamage(damage,isCrit,'monsterSprite');
            
            if(isCrit){
                this.addLog(`${this.player.name}發動暴擊！造成 ${Math.floor(damage)} 傷害`,'crit');
                document.getElementById('monsterSprite').classList.add('hitShake');
                setTimeout(()=>document.getElementById('monsterSprite').classList.remove('hitShake'),250);
            }else{
                this.addLog(`${this.player.name}攻擊！造成 ${Math.floor(damage)} 傷害`,'damage');
                document.getElementById('monsterSprite').classList.add('hitShake');
                setTimeout(()=>document.getElementById('monsterSprite').classList.remove('hitShake'),250);
            }

            this.render();
            if(this.monsterHp>0) setTimeout(()=>this.monsterAttack(),800);
        },

        monsterAttack(){
            if(this.monsterHp<=0) return;
            const monsterSprite=document.getElementById('monsterSprite');
            monsterSprite.style.animation='none';
            setTimeout(()=>monsterSprite.style.animation='monsterAttack .4s',10);

            const dodge=Math.random()<0.1;
            if(dodge){
                this.addLog(`${this.monster.name}的攻擊被躲避了！`,'miss');
                this.floatDamage('躲避',false,'playerSprite');
            }else{
                const baseDamage=this.monster.dmg||5;
                const variance=Math.floor(Math.random()*baseDamage*0.2);
                let damage=baseDamage+variance;
                this.playerHp-=damage;
                this.floatDamage(damage,false,'playerSprite');
                this.addLog(`${this.monster.name}攻擊！造成 ${Math.floor(damage)} 傷害`,'damage');
                document.getElementById('playerSprite').classList.add('hitShake');
                setTimeout(()=>document.getElementById('playerSprite').classList.remove('hitShake'),250);
            }

            this.render();
            setTimeout(()=>this.canAct=true,400);
        },

        floatDamage(damage,isCrit,target){
            const elem=document.getElementById(target);
            if(!elem) return;
            const dmgElem=document.createElement('div');
            dmgElem.className='damageFloat '+(isCrit?'crit':typeof damage==='number'?'normal':'miss');
            dmgElem.textContent=damage;
            dmgElem.style.left=elem.offsetLeft+'px';
            dmgElem.style.top=elem.offsetTop+'px';
            document.getElementById('battleField').appendChild(dmgElem);
            setTimeout(()=>dmgElem.remove(),1000);
        },

        usePotion(){
            if(!this.canAct)return;
            const oldHp=this.playerHp;
            this.playerHp=Math.min(this.playerHp+50,this.playerMaxHp);
            const healed=this.playerHp-oldHp;
            if(healed<=0){this.addLog('已滿血','info');return;}
            
            this.canAct=false;
            this.floatDamage('+'+Math.floor(healed),'heal','playerSprite');
            this.addLog(`使用藥水，恢復 ${Math.floor(healed)} 血量`,'heal');
            this.render();
            setTimeout(()=>this.monsterAttack(),800);
        },

        flee(){
            if(!this.canAct)return;
            const success=Math.random()<0.4;
            if(success){
                this.addLog('逃離成功！','info');
                setTimeout(()=>Game.closeBattle(),500);
            }else{
                this.addLog('逃離失敗！','info');
                this.canAct=false;
                setTimeout(()=>this.monsterAttack(),800);
            }
        }
    };

    window.Battle=Battle;
    document.getElementById('attackBtn').onclick=()=>Battle.playerAttack();
    document.getElementById('skillBtn').onclick=()=>Battle.playerAttack();
    document.getElementById('potionBtn').onclick=()=>Battle.usePotion();
    document.getElementById('fleeBtn').onclick=()=>Battle.flee();
})();

/* ===== Game Mock ===== */
const Game={
    startBattle(monsterName,monsterHp,monsterDmg){
        const player={
            name:'玩家',
            hp:100,
            dmg:15
        };
        const monster={
            name:monsterName||'怪物',
            hp:monsterHp||50,
            dmg:monsterDmg||5
        };
        Battle.init(player,monster);
    },

    closeBattle(){
        document.getElementById('battleModal').classList.remove('show');
        Battle.active=false;
    }
};

window.Game=Game;
</script>
</body>
</html>
