<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天堂M Core Rebuild V24｜簡單戰鬥動畫版</title>
<style>
:root{--bg:#05070a;--panel:#101827;--panel2:#172235;--line:#334155;--text:#e5eef9;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--purple:#c084fc;--orange:#fb923c;--cyan:#06b6d4;}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}.modal.hide{display:none}
.modal-card{background:var(--panel);border-radius:8px;padding:24px;max-width:600px;box-shadow:0 10px 40px rgba(0,0,0,0.8)}
.title{font-size:20px;font-weight:600;color:var(--text);margin:0 0 12px 0}
.muted{color:var(--muted);font-size:12px}
.panel{background:var(--panel);border-radius:8px;padding:16px;border:1px solid var(--line)}
.grid{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{padding:8px 16px;background:var(--blue);color:var(--text);border:none;border-radius:4px;cursor:pointer;font-weight:600}
button:hover{opacity:0.9}
button:disabled{opacity:0.5;cursor:not-allowed}
.r-N{color:#94a3b8}.r-R{color:#60a5fa}.r-SR{color:#a855f7}.r-SSR{color:#f59e0b}.r-L{color:#ef4444}.r-M{color:#ec4899}
.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}.orange{color:var(--orange)}

/* 戰鬥畫面樣式 V24 */
.battle-scene{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f172a,#1a202c);display:flex;align-items:center;justify-content:center;z-index:2000;animation:battleFadeIn 0.3s ease-out}
@keyframes battleFadeIn{from{opacity:0}to{opacity:1}}
.battle-container{display:flex;align-items:center;justify-content:space-between;width:90%;max-width:1000px;gap:40px;position:relative}
.battle-character,.battle-monster{display:flex;flex-direction:column;align-items:center;gap:12px}
.battle-avatar{width:120px;height:120px;border-radius:12px;background:linear-gradient(135deg,#1e3a8a,#312e81);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;animation:battleBounce 0.6s ease-out}
@keyframes battleBounce{0%{transform:scale(0.8)},50%{transform:scale(1.1)},100%{transform:scale(1)}}
.battle-name{font-weight:600;font-size:16px;white-space:nowrap}
.battle-hp{width:120px;height:20px;background:#374151;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.battle-hp-bar{height:100%;background:linear-gradient(90deg,var(--green),#10b981);width:100%;transition:width 0.3s ease-out}
.battle-hp-text{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.battle-damage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:700;pointer-events:none;z-index:10;animation:battleDamageFloat 0.8s ease-out forwards}
@keyframes battleDamageFloat{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(0.5)}}
.battle-damage.crit{color:var(--red);text-shadow:0 0 8px var(--red);font-size:44px}
.battle-damage.normal{color:var(--gold);text-shadow:0 0 4px var(--gold)}
.battle-info{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);text-align:center;font-size:14px;color:var(--muted);width:100%;max-width:400px}
.battle-action-text{color:var(--cyan);font-weight:600;margin-bottom:8px}

/* 狩獵頁面 */
.hunt-container{display:grid;grid-template-columns:1fr 2fr;gap:20px;margin-top:16px}
.hunt-map-list{display:flex;flex-direction:column;gap:8px;max-height:500px;overflow-y:auto}
.hunt-map-item{padding:12px;background:var(--panel2);border-radius:6px;cursor:pointer;border:1px solid var(--line);transition:all 0.2s}
.hunt-map-item.active{border-color:var(--gold);background:rgba(250,204,21,0.1)}
.hunt-map-item:hover{background:rgba(255,255,255,0.05)}
.hunt-monsters{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.monster-tag{padding:4px 8px;background:rgba(255,255,255,0.1);border-radius:3px;font-size:11px;color:var(--muted)}
.hunt-action{padding:12px;background:var(--panel);border-radius:6px;margin-top:12px}
.hunt-action button{width:100%;padding:12px}
</style>
</head><body>
<div id="start" class="modal"><div class="panel modal-card"><h1 class="title" style="font-size:40px;text-align:center">天堂M Core Rebuild</h1><p class="muted" style="text-align:center">單機HTML｜離線存檔｜V24 簡單戰鬥動畫版</p><button data-act="new" style="width:100%">新遊戲</button> <button id="loadBtn" data-act="load" style="width:100%;margin-top:8px">讀取存檔</button></div></div>
<div id="classModal" class="modal"><div class="panel modal-card"><h2 class="title">選擇職業</h2><div id="classList" class="grid classes"></div><div class="row" style="margin-top:12px"><button data-act="close">返回</button></div></div></div>
<div id="app" class="app hide"><div class="panel top"><div><span class="title" style="font-size:22px">天堂M Core Rebuild V24｜簡單戰鬥動畫版</span> <span id="subtitle" class="muted"></span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button data-act="save">存檔</button> <button data-act="new">新遊戲</button> <button data-act="load">讀取</button></div></div><div id="content" style="margin-top:16px"></div><div id="log" style="margin-top:16px;padding:12px;background:var(--panel2);border-radius:6px;max-height:200px;overflow-y:auto;font-size:12px"></div></div>

<!-- V24 戰鬥畫面 -->
<div id="battleScene" class="battle-scene hide" style="display:none">
  <div class="battle-container">
    <div class="battle-character">
      <div class="battle-avatar" id="battleCharAvatar">🧙</div>
      <div class="battle-name" id="battleCharName">角色</div>
      <div class="battle-hp"><div class="battle-hp-bar" id="battleCharHPBar"></div></div>
      <div class="battle-hp-text" id="battleCharHPText">100/100</div>
    </div>
    <div id="battleDamageContainer"></div>
    <div class="battle-character">
      <div class="battle-avatar" id="battleMonAvatar">👹</div>
      <div class="battle-name" id="battleMonName">怪物</div>
      <div class="battle-hp"><div class="battle-hp-bar" id="battleMonHPBar"></div></div>
      <div class="battle-hp-text" id="battleMonHPText">100/100</div>
    </div>
  </div>
  <div class="battle-info">
    <div class="battle-action-text" id="battleActionText">戰鬥進行中...</div>
    <div style="font-size:12px;color:var(--muted)" id="battleActionDesc"></div>
  </div>
</div>

<script>
'use strict';
const R={N:['一般',1],R:['高級',2],SR:['稀有',3],SSR:['英雄',4],L:['傳說',5],M:['神話',6]};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DB={classes:{},item:{},cards:{},maps:[],dungeons:[],bosses:[],codex:[],skills:{}};
function addClass(id,name,stats,weapons,desc){DB.classes[id]={id,name,stats,weapons,desc};}
[['prince','王族',{str:13,dex:10,con:12,int:10,wis:11},['sword','dagger'],'血盟與輔助'],['knight','騎士',{str:16,dex:12,con:15,int:8,wis:9},['sword','twohand','spear'],'高防禦近戰'],['elf','妖精',{str:8,dex:15,con:8,int:13,wis:10},['bow','sword'],'高敏捷遠程'],['dk','黑騎士',{str:18,dex:10,con:14,int:10,wis:8},['twohand','sword'],'高傷害近戰'],['mage','法師',{str:8,dex:8,con:10,int:18,wis:14},['staff'],'高魔法輸出']].forEach(x=>addClass(...x));
function addItem(id,o){DB.item[id]=Object.assign({id,type:'material',rank:'N',price:100},o);}
const weapons=[['short_sword','短劍','dagger',5,'N'],['katana','武士刀','sword',17,'R'],['mailbreaker','破壞之劍','sword',24,'SR'],['death_blade','死亡騎士烈炎劍','sword',36,'SSR'],['dragon_slayer','屠龍劍','sword',52,'L'],['mythic_excalibur','神話聖劍','sword',85,'M']];
weapons.forEach((x,i)=>addItem(x[0],{name:x[1],type:'weapon',weapon:x[2],dmg:x[3],rank:x[4],safe:6,price:1200*(i+1)*R[x[4]][1]}));
[['tshirt','T恤','tshirt',0,'N',{}],['iron_helm','鋼盔','helmet',-2,'R',{}],['iron_armor','鋼鐵盔甲','armor',-7,'R',{}],['magic_cloak','抗魔斗篷','cloak',-3,'SR',{mr:10}],['power_gloves','力量手套','gloves',0,'R',{str:2}]].forEach(x=>addItem(...x));
[['brave_necklace','勇氣項鍊','amulet',{dmg:3},'SR'],['wisdom_ring','智慧戒指','ring',{int:2,wis:1},'SR'],['def_ring','守護戒指','ring',{ac:-2,dr:2},'SR'],['dark_earring','黑暗耳環','earring',{str:1,dmg:2},'SR']].forEach(x=>addItem(...x));
[['potion_red','紅水',45,90],['potion_orange','橙水',210,260],['potion_clear','白水',650,680],['leaf_box','葉子補充箱',5000,0]].forEach(x=>addItem(x[0],{name:x[1],type:x[0]=='leaf_box'?'box':'potion',price:x[3]>0?x[3]:null,hp:x[2],mp:x[3]}));
[['scroll_weapon','武卷','weapon',75000],['scroll_armor','防卷','armor',30000],['scroll_bless_weapon','祝武','weapon',260000],['scroll_bless_armor','祝防','armor',120000]].forEach(x=>addItem(x[0],{name:x[1],type:'scroll',target:x[2],price:x[3]}));
function card(id,name,rank,stat,kind){DB.cards[id]={id,name,rank,stat,kind};}
[['t_orc','妖魔','N',{spd:3},'transform'],['t_skel','骷髏','R',{dex:1,spd:5},'transform'],['t_succ','魅魔','SR',{int:2,mp:80,spd:8},'transform'],['t_dk','死亡騎士','SSR',{str:3,dmg:8,hit:5,spd:10},'transform']].forEach(x=>card(...x));
DB.maps=[['talking','說話之島',1,18,['哥布林','妖魔','狼人'],['short_sword','tshirt','potion_red']],['gludin','古魯丁地監',18,38,['骷髏','殭屍','食屍鬼'],['katana','iron_helm','potion_orange']],['giran','奇岩城堡',38,60,['黑騎士','食人妖精','萊肯'],['mailbreaker','iron_armor','potion_clear']]];
DB.dungeons=[{id:'dg0',name:'試煉副本',lv:10,cost:100,reward:5000},{id:'dg1',name:'夢幻之島',lv:30,cost:200,reward:15000}];
DB.bosses=[{id:'b0',name:'巨大飛龍',lv:30,hp:1500},{id:'b1',name:'巴風特',lv:40,hp:2500}];
DB.codex=[];
const skillNames={prince:[],knight:[],elf:[],dk:[],mage:[]};
const Store={key:'lm_core_rebuild_v24',save:s=>localStorage.setItem(Store.key,JSON.stringify(s)),load:()=>{try{return JSON.parse(localStorage.getItem(Store.key)||'null')}catch{return null}}};
const Game={s:null,timer:null,tab:'hunt',pick:null,$:id=>document.getElementById(id),init(){this.bind();this.classList();this.$('loadBtn').disabled=!Store.load();},base(cls){const c=DB.classes[cls]||DB.classes.knight;return{version:'core_rebuild_v24',cls:c.id,lv:1,exp:0,adena:3000,diamond:0,leaf:200,hp:1,mp:1,map:'talking',mon:null,stats:{...c.stats},inv:{'potion_red|0':{id:'potion_red',qty:30,enchant:0},'short_sword|0|start':{id:'short_sword',qty:1,enchant:0},'tshirt|0|start':{id:'tshirt',qty:1,enchant:0}},equip:{weapon:null,helmet:null,tshirt:null,armor:null,cloak:null,gloves:null,boots:null,amulet:null,belt:null,earring1:null,earring2:null,ring1:null,ring2:null},cards:{},active:{transform:null,doll:null},daily:{dungeon:3,boss:1,kills:0},ach:{kills:0,boss:0},last:Date.now()}},ensure(){if(!this.s)return;const c=DB.classes[this.s.cls]||DB.classes.knight;this.s.lv=Math.max(1,Math.min(99,this.s.lv||1));this.s.hp=Math.max(1,this.s.hp||1);this.s.mp=Math.max(0,this.s.mp||0);this.s.stats=Object.assign({},c.stats||{},this.s.stats||{})},cls(){return DB.classes[this.s.cls]||DB.classes.knight},map(){return DB.maps.find(m=>m.id===this.s.map)||DB.maps[0]},total(){const st=Object.assign({},this.s.stats||{});Object.values(this.s.equip).forEach(k=>{const it=this.inv(k),d=it?this.def(it.id):null;if(!d)return;if(d.dmg)st.dmg=(st.dmg||0)+d.dmg;if(d.ac!==undefined)st.ac=(st.ac||0)+d.ac;Object.entries(d.stat||{}).forEach(([key,val])=>st[key]=(st[key]||0)+val)});return st},maxHp(){const st=this.total();return Math.max(1,Math.floor(120+this.s.lv*22+(st.con||10)*12))},maxMp(){const st=this.total();return Math.max(1,Math.floor(55+this.s.lv*9+(st.wis||10)*8+(st.int||10)*5))},fmt(n){return Math.floor(n||0).toLocaleString()},rand(a,b){return Math.floor(Math.random()*(b-a+1))+a},log(msg,color='blue'){const el=this.$('log');if(!el)return;const line=document.createElement('div');line.textContent=msg;if(color)line.style.color='var(--'+color+')';el.appendChild(line);el.scrollTop=el.scrollHeight},split(k){return String(k).split('|')[0]},inv(k){if(!k)return null;const key=Array.isArray(k)?k[0]:String(k).split('|')[0];return this.s.inv[key]},def(id){return DB.item[id]||DB.cards[id]},action(a,arg){if(a==='new'){Game.$('start').classList.add('hide');Game.$('classModal').classList.remove('hide');return}if(a==='selectClass'){Game.s=Game.base(arg);Game.ensure();Game.$('classModal').classList.add('hide');Game.$('app').classList.remove('hide');Game.render();return}if(a==='hunt'){const m=DB.maps.find(x=>x.id==arg);if(!m)return;Game.s.map=arg;Game.s.mon=null;Game.render();return}if(a==='attack'){Game.initBattle();return}if(a==='close'){Game.$('start').classList.remove('hide');Game.$('classModal').classList.add('hide');return}if(a==='save'){Game.save();return}if(a==='load'){const data=Store.load();if(data){Game.s=data;Game.ensure();Game.$('start').classList.add('hide');Game.$('app').classList.remove('hide');Game.render()}return}},bind(){const app=this.$('app');if(!app)return;app.addEventListener('click',e=>{const btn=e.target.closest('button[data-act]');if(!btn)return;const act=btn.dataset.act,arg=btn.dataset.arg;this.action(act,arg)})},classList(){const el=this.$('classList');if(!el)return;el.innerHTML=Object.values(DB.classes).map(c=>`<div style="padding:12px;background:var(--panel2);border-radius:6px;cursor:pointer;border:1px solid var(--line)" data-act="selectClass" data-arg="${c.id}"><b>${c.name}</b><br><span class="muted">${c.desc}</span></div>`).join('')},save(){Store.save(this.s);this.log('遊戲已儲存','green')},render(){this.ensure();const st=this.total();const maxHp=this.maxHp();const maxMp=this.maxMp();this.$('subtitle').textContent=`Lv.${this.s.lv} ${this.cls().name} | HP ${this.fmt(this.s.hp)}/${this.fmt(maxHp)} | 金幣 ${this.fmt(this.s.adena)} | 鑽石 ${this.fmt(this.s.diamond)}`;const content=this.$('content');if(!content)return;let html=`<div class="hunt-container"><div class="hunt-map-list">`;DB.maps.forEach(m=>{html+=`<div class="hunt-map-item ${m.id===this.s.map?'active':''}" data-act="hunt" data-arg="${m.id}"><b>${m.name}</b> Lv.${m.min}-${m.max}<div class="hunt-monsters">${m.mons.map(mon=>`<span class="monster-tag">${mon}</span>`).join('')}</div></div>`});html+=`</div><div><div class="panel"><b style="color:var(--gold)">當前區域</b><p style="margin:8px 0 16px 0;font-size:16px">${this.map().name}</p><div class="hunt-action"><button data-act="attack" style="font-size:14px;padding:16px">⚔️ 攻擊怪物</button></div><div style="margin-top:16px;padding:12px;background:var(--panel2);border-radius:6px"><b>角色資訊</b><br><span class="muted" style="display:block;margin-top:8px">STR ${st.str||0} | DEX ${st.dex||0} | CON ${st.con||0} | INT ${st.int||0} | WIS ${st.wis||0}<br>傷害 ${Math.floor((st.dmg||0)+this.s.lv*2)} | AC ${st.ac||0} | 減傷 ${st.dr||0}</span></div></div></div></div>`;content.innerHTML=html},initBattle(){const m=this.map();const monsters=m.mons||['怪物'];const monName=monsters[Math.floor(Math.random()*monsters.length)];const charHp=this.s.hp;const charMaxHp=this.maxHp();const monHp=Math.max(100,this.s.lv*50);this.showBattleScene(this.cls().name,charHp,charMaxHp,monName,monHp,monMaxHp=>this.executeBattle(monName,monMaxHp))},showBattleScene(charName,charHp,charMaxHp,monName,monHp,callback){const scene=this.$('battleScene');scene.style.display='flex';const charAva=this.$('battleCharAvatar');const charHpBar=this.$('battleCharHPBar');const charHpTxt=this.$('battleCharHPText');const monAva=this.$('battleMonAvatar');const monHpBar=this.$('battleMonHPBar');const monHpTxt=this.$('battleMonHPText');this.$('battleCharName').textContent=charName;this.$('battleMonName').textContent=monName;charHpBar.style.width='100%';monHpBar.style.width='100%';charHpTxt.textContent=`${this.fmt(charHp)}/${this.fmt(charMaxHp)}`;monHpTxt.textContent=`${this.fmt(monHp)}/${this.fmt(monHp)}`;charAva.textContent='🧙';monAva.textContent='👹';callback(monHp)},executeBattle(monName,monMaxHp){const st=this.total();const baseDmg=Math.max(1,Math.floor((st.dmg||0)+this.s.lv*2));const variance=Math.floor(baseDmg*0.2);const damage=baseDmg+this.rand(-variance,variance);const isCrit=Math.random()<0.15;const finalDmg=isCrit?Math.floor(damage*1.5):damage;let charHp=this.s.hp;let monHp=monMaxHp;let round=0;const maxRounds=Math.ceil(monMaxHp/finalDmg)+5;const battleLoop=setInterval(()=>{round++;const scene=this.$('battleScene');const damageContainer=this.$('battleDamageContainer');if(round%2===1){monHp=Math.max(0,monHp-finalDmg);const dmgEl=document.createElement('div');dmgEl.className=`battle-damage ${isCrit?'crit':'normal'}`;dmgEl.textContent=finalDmg;dmgEl.style.top='50%';dmgEl.style.left='65%';damageContainer.appendChild(dmgEl);setTimeout(()=>dmgEl.remove(),800);const monHpBar=this.$('battleMonHPBar');const pct=Math.max(0,monHp/monMaxHp*100);monHpBar.style.width=pct+'%';this.$('battleMonHPText').textContent=`${this.fmt(monHp)}/${this.fmt(monMaxHp)}`}else if(round%2===0&&round<maxRounds){const monDmg=this.rand(Math.floor(this.s.lv*1.5),Math.floor(this.s.lv*3));charHp=Math.max(0,charHp-monDmg);const dmgEl=document.createElement('div');dmgEl.className='battle-damage normal';dmgEl.textContent=monDmg;dmgEl.style.top='50%';dmgEl.style.left='35%';dmgEl.style.color='var(--red)';damageContainer.appendChild(dmgEl);setTimeout(()=>dmgEl.remove(),800);const charHpBar=this.$('battleCharHPBar');const charMaxHp=this.maxHp();const pct=Math.max(0,charHp/charMaxHp*100);charHpBar.style.width=pct+'%';this.$('battleCharHPText').textContent=`${this.fmt(charHp)}/${this.fmt(charMaxHp)}`}if(monHp<=0){this.$('battleActionText').textContent='✓ 戰鬥勝利！';clearInterval(battleLoop);setTimeout(()=>{scene.style.display='none';this.s.hp=Math.max(1,charHp);this.s.daily.kills=(this.s.daily.kills||0)+1;this.s.ach.kills=(this.s.ach.kills||0)+1;this.s.adena+=this.rand(100,300);this.s.exp=(this.s.exp||0)+this.rand(50,150);this.log(`擊殺 ${monName}！獲得金幣、經驗值`,'green');this.render()},1500)}else if(round>=maxRounds){this.$('battleActionText').textContent='戰鬥結束';this.$('battleActionDesc').textContent='怪物逃脫了...';clearInterval(battleLoop);setTimeout(()=>{scene.style.display='none';this.s.hp=charHp;this.render()},2000)}},400)}};window.DB=DB;window.G=Game;document.addEventListener('DOMContentLoaded',()=>Game.init());
</script>
</body>
